# Local GitHub Actions self-hosted runner.
#
# Setup:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up -d --build
#
# For EdTok:
#   REPO_URL=https://github.com/zwymer/EdTok
#   RUNNER_NAME_PREFIX=edtok-local

name: local-gh-runner

x-runner: &runner-defaults
  build: .
  restart: unless-stopped
  env_file:
    - .env
  environment: &runner-env
    RUNNER_SCOPE: repo
    LABELS: self-hosted,Linux,X64,docker,local
    EPHEMERAL: "true"
    DISABLE_AUTO_UPDATE: "true"
  security_opt:
    - label:disable
    - no-new-privileges:true
  networks:
    - runner-net
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: 8G

services:
  runner-1:
    <<: *runner-defaults
    container_name: gh-runner-1
    volumes:
      - runner-workdir-1:/_work

  runner-2:
    <<: *runner-defaults
    container_name: gh-runner-2
    volumes:
      - runner-workdir-2:/_work

  # Dedicated runner for protected terraform/deploy jobs (runs-on: edtok-production).
  runner-prod:
    <<: *runner-defaults
    container_name: gh-runner-prod
    environment:
      <<: *runner-env
      LABELS: self-hosted,Linux,X64,docker,local,edtok-production
    volumes:
      - runner-workdir-prod:/_work

volumes:
  runner-workdir-1:
  runner-workdir-2:
  runner-workdir-prod:

networks:
  runner-net:
    driver: bridge
